 buildscript {
    ext.kotlin_version = '2.1.20'

    repositories {
        google()
        mavenCentral()
        jcenter() //here
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.13'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.7.1'

    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }

}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.7.0'
    }
}

// lean_file_picker's own build.gradle targets AGP 4.1.3 and doesn't
// resolve its namespace correctly under this project's AGP 8.3.0.
// Patch it in here instead of touching the plugin's own source, since
// pub-cache is regenerated on every `flutter pub get`.
project(':lean_file_picker') {
    afterEvaluate {
        android.namespace = "ch.perron2.lean_file_picker"
    }
}